name: Bash checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Bash syntax
        run: |
          bash -n anytls.sh
          bash -n tests/regression.sh
      - name: ShellCheck
        run: shellcheck -x anytls.sh tests/regression.sh
      - name: Run regression tests
        run: bash tests/regression.sh
